<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>HTTP Request</title>
  <link rel="stylesheet" href="../../static/css/sdpi.css" />
  <style>
    body { margin: 0; background: #2d2d2d; color: #fff; }
    .sdpi-wrapper { display: none; }
    .hint { opacity: 0.7; font-size: 11px; padding: 0 0 8px 0; }
    .live-box {
      margin: 4px 0 10px;
      padding: 8px;
      border-radius: 4px;
      background: #1e1e1e;
      border: 1px solid #3a3a3a;
    }
    .live-status { font-size: 11px; margin-top: 6px; opacity: 0.9; }
    .live-status.ok { color: #7dcea0; }
    .live-status.err { color: #f1948a; }
    #result {
      margin: 8px 0 0;
      padding: 8px;
      border-radius: 4px;
      background: #1e1e1e;
      font-family: Consolas, monospace;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 2em;
    }
    #result.ok { color: #7dcea0; }
    #result.err { color: #f1948a; }
  </style>
</head>
<body>
  <div class="sdpi-wrapper" style="display:block">
    <div type="group" class="sdpi-item" style="margin-top:4px">
      <div class="sdpi-item-label" style="text-align:left;width:100%">Live Mode</div>
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">Цифры</div>
      <select class="sdpi-item-value select" id="liveMode">
        <option value="1">ON — показывать W/L/ранг</option>
        <option value="0">OFF — без цифр</option>
      </select>
    </div>
    <div class="sdpi-item">
      <div class="sdpi-item-label">Widget URL</div>
      <input class="sdpi-item-value" id="baseUrl" type="text" placeholder="http://127.0.0.1:19123" />
    </div>
    <div class="sdpi-item">
      <div class="sdpi-item-label">На этой кнопке</div>
      <select class="sdpi-item-value select" id="liveDisplay">
        <option value="auto">Авто (по пресету)</option>
        <option value="wins">Число побед</option>
        <option value="losses">Число поражений</option>
        <option value="rank">Ранг</option>
        <option value="role">Роль</option>
        <option value="none">OFF — без цифр здесь</option>
      </select>
    </div>
    <div id="liveStatus" class="live-status" style="padding:4px 8px 10px">Live: …</div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">Preset</div>
      <select class="sdpi-item-value select" id="preset">
        <option value="custom">Custom</option>
        <option value="win">Widget Win</option>
        <option value="win_down">Widget Win -1</option>
        <option value="loss">Widget Loss</option>
        <option value="loss_down">Widget Loss -1</option>
        <option value="rank">Widget Current Rank</option>
        <option value="rank_up">Widget Rank Up</option>
        <option value="rank_down">Widget Rank Down</option>
        <option value="reset">Widget Reset</option>
        <option value="game_next">Widget Game Next</option>
        <option value="mode_next">Widget Mode Next</option>
        <option value="role_next">Widget Role Next</option>
        <option value="show">Widget Show Overlay</option>
        <option value="rank_up_tank">Rank↑ Tank</option>
        <option value="rank_up_support">Rank↑ Support</option>
        <option value="rank_up_damage">Rank↑ Damage</option>
        <option value="rank_down_tank">Rank↓ Tank</option>
        <option value="rank_down_support">Rank↓ Support</option>
        <option value="rank_down_damage">Rank↓ Damage</option>
      </select>
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">URL</div>
      <input class="sdpi-item-value" id="url" type="text" placeholder="http://127.0.0.1:19123/api/win" />
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">Method</div>
      <select class="sdpi-item-value select" id="method">
        <option value="GET">GET</option>
        <option value="POST">POST</option>
        <option value="PUT">PUT</option>
        <option value="PATCH">PATCH</option>
        <option value="DELETE">DELETE</option>
        <option value="HEAD">HEAD</option>
      </select>
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">Content-Type</div>
      <select class="sdpi-item-value select" id="contentType">
        <option value="application/json">application/json</option>
        <option value="application/x-www-form-urlencoded">application/x-www-form-urlencoded</option>
        <option value="text/plain">text/plain</option>
        <option value="">(none)</option>
      </select>
    </div>

    <div type="textarea" class="sdpi-item">
      <div class="sdpi-item-label">Headers (JSON)</div>
      <textarea class="sdpi-item-value" id="headers" rows="3" placeholder='{"Authorization":"Bearer ..."}'></textarea>
    </div>

    <div type="textarea" class="sdpi-item">
      <div class="sdpi-item-label">Body</div>
      <textarea class="sdpi-item-value" id="body" rows="4" placeholder='{"ok":true}'></textarea>
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">Timeout (ms)</div>
      <input class="sdpi-item-value" id="timeout" type="number" min="500" step="100" value="5000" />
    </div>

    <div type="checkbox" class="sdpi-item">
      <div class="sdpi-item-label">Статус на кнопке</div>
      <div class="sdpi-item-value">
        <input id="showStatus" type="checkbox" value="true" checked />
        <label for="showStatus"><span></span></label>
      </div>
    </div>

    <div class="sdpi-item">
      <button class="sdpi-item-value" id="testBtn" type="button">Test request</button>
    </div>

    <div class="hint">Нажатия работают всегда. Цифры — только если Live Mode = ON и пресет Win/Loss/Rank.</div>
    <div id="result"></div>
  </div>

  <script src="../utils/common.js"></script>
  <script src="../utils/action.js"></script>
  <script src="./index.js"></script>
</body>
</html>
